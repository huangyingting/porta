# Dependency updates arrive as PRs to the rust branch, the only branch that
# promotes to main. CI's dependency check catches advisories in between.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    target-branch: rust
    schedule:
      interval: weekly
    ignore:
      # Pinned in porta-client and porta-android; see the comment there.
      - dependency-name: rustls-platform-verifier
    groups:
      rust:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /android
    target-branch: rust
    schedule:
      interval: weekly
    groups:
      android:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: rust
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /experiments/masque-interop
    target-branch: rust
    schedule:
      interval: monthly
