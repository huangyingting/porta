name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  GOMAXPROCS: "4"
  GOFLAGS: "-p=2"
  PORTA_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  windows:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows release source
        shell: pwsh
        run: |
          go test -count=1 ./internal/clientapp ./internal/clientid ./internal/clientprofile ./internal/device ./internal/winnetwork ./cmd/porta-client ./cmd/porta-windows
          if ($LASTEXITCODE -ne 0) { throw "Windows tests failed" }
          go test ./scripts/package-windows.go ./scripts/package-windows_test.go
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging tests failed" }
      - name: Test Windows release frontend
        run: node --test cmd/porta-windows/frontend_test.cjs
      - name: Build Windows release applications
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          go build -tags production -trimpath -ldflags="-s -w -H=windowsgui" -o package/porta.exe ./cmd/porta-windows
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop build failed" }
          go build -trimpath -ldflags="-s -w" -o package/porta-cli.exe ./cmd/porta-client
          if ($LASTEXITCODE -ne 0) { throw "Windows CLI build failed" }
      - name: Package Windows release applications
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $expected = "07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51"
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash -ne $expected) {
            throw "Wintun archive checksum mismatch"
          }
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll package\wintun.dll
          go run ./scripts/package-windows.go porta-client-windows-amd64.zip package
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: porta-windows-release
          path: porta-client-windows-amd64.zip
          if-no-files-found: error

  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    needs: windows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify release version
        run: |
          ./scripts/check-version.sh
          version=$(<internal/buildinfo/VERSION)
          tag="v$version"
          if [[ $(git rev-parse HEAD) != "$PORTA_RELEASE_SHA" ]]; then
            echo "checkout does not match the successful CI commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PORTA_RELEASE_SHA" refs/remotes/origin/main; then
            echo "successful CI commit is not on main" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            if [[ "$tag_commit" != "$PORTA_RELEASE_SHA" ]]; then
              echo "release tag $tag already belongs to a different commit" >&2
              exit 1
            fi
          fi
          patch=${version##*.}
          {
            echo "PORTA_RELEASE_TAG=$tag"
            echo "PORTA_ANDROID_VERSION_NAME=$version"
            echo "PORTA_ANDROID_VERSION_CODE=$((1000 + 10#$patch))"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare persistent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PORTA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PORTA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTA_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "All four PORTA_ANDROID signing secrets are required; debug-key fallback is forbidden" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/porta-release.p12"
          test -s "$RUNNER_TEMP/porta-release.p12"
          echo "PORTA_ANDROID_KEYSTORE=$RUNNER_TEMP/porta-release.p12" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install Go mobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test release source
        run: |
          make test-automation
          make test
          make vet
      - name: Build Go release binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/porta-server-linux-$arch" ./cmd/porta-server
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/porta-client-linux-$arch" ./cmd/porta-client
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/porta-keygen-linux-$arch" ./cmd/porta-keygen
          done
          for binary in dist/porta-{server,client,keygen}-linux-*; do
            headers=$(readelf -l "$binary")
            if grep -q 'INTERP' <<<"$headers"; then
              echo "$binary is not a static Go binary" >&2
              exit 1
            fi
          done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: porta-windows-release
          path: dist
      - name: Package deployment tools
        run: |
          mkdir -p dist/deploy-bundle/porta/scripts dist/deploy-bundle/porta/deploy
          cp scripts/deploy.sh scripts/server-up.sh scripts/server-down.sh scripts/sync-cert.sh dist/deploy-bundle/porta/scripts/
          cp deploy/99-porta-quic.conf deploy/porta-cert-sync.timer dist/deploy-bundle/porta/deploy/
          tar -C dist/deploy-bundle -czf dist/porta-deploy.tar.gz porta
      - name: Build Android release
        working-directory: android
        env:
          PORTA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PORTA_ANDROID_KEYSTORE_PASSWORD }}
          PORTA_ANDROID_KEY_ALIAS: ${{ secrets.PORTA_ANDROID_KEY_ALIAS }}
          PORTA_ANDROID_KEY_PASSWORD: ${{ secrets.PORTA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest assembleRelease --no-daemon
          expected=$(tr -d '\r\n' < signing-certificate.sha256)
          for apk in app/build/outputs/apk/release/*.apk; do
            actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" |
              sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p')
            [[ "$actual" == "$expected" ]] || {
              echo "APK signing identity does not match the Porta certificate pin: $apk" >&2
              exit 1
            }
          done
      - name: Collect artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/porta-android-arm64-v8a.apk
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/porta-android-armeabi-v7a.apk
          cp android/app/build/outputs/apk/release/app-x86_64-release.apk dist/porta-android-x86_64.apk
          cd dist
          sha256sum porta-server-* porta-client-* porta-keygen-* porta-android-* porta-deploy.tar.gz > SHA256SUMS
      - name: Sign release manifest
        env:
          PORTA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PORTA_ANDROID_KEYSTORE_PASSWORD }}
          PORTA_ANDROID_KEY_ALIAS: ${{ secrets.PORTA_ANDROID_KEY_ALIAS }}
          PORTA_ANDROID_KEY_PASSWORD: ${{ secrets.PORTA_ANDROID_KEY_PASSWORD }}
        run: |
          java scripts/SignReleaseManifest.java \
            "$PORTA_ANDROID_KEYSTORE" \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/release-signing-cert.der \
            "$(tr -d '\r\n' < android/signing-certificate.sha256)"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${PORTA_RELEASE_TAG:?release version has not been verified}"
          : "${PORTA_RELEASE_SHA:?successful CI commit has not been verified}"
          if draft=$(gh release view "$PORTA_RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "release $PORTA_RELEASE_TAG is already published; refusing to replace live artifacts" >&2
              exit 1
            fi
          else
            if ! git show-ref --verify --quiet "refs/tags/$PORTA_RELEASE_TAG"; then
              git tag "$PORTA_RELEASE_TAG" "$PORTA_RELEASE_SHA"
              git push origin "refs/tags/$PORTA_RELEASE_TAG"
            fi
            gh release create "$PORTA_RELEASE_TAG" --draft --generate-notes --verify-tag
          fi
          gh release upload "$PORTA_RELEASE_TAG" --clobber \
            dist/porta-server-* \
            dist/porta-client-* \
            dist/porta-keygen-* \
            dist/porta-android-* \
            dist/porta-deploy.tar.gz \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig \
            dist/release-signing-cert.der
          gh release edit "$PORTA_RELEASE_TAG" --draft=false
      - name: Remove temporary Android signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/porta-release.p12"
