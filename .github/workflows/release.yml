name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Install Go mobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - uses: gradle/actions/setup-gradle@v4
      - name: Test release source
        run: |
          make test
          make vet
      - name: Build Go release binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/porta-server-linux-$arch" ./cmd/porta-server
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/porta-client-linux-$arch" ./cmd/porta-client
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/porta-keygen-linux-$arch" ./cmd/porta-keygen
          done
          make build-windows
          cp bin/porta-client-windows-amd64.zip dist/
      - name: Package deployment tools
        run: |
          mkdir -p dist/deploy-bundle/porta/scripts dist/deploy-bundle/porta/deploy
          cp scripts/deploy.sh scripts/server-up.sh scripts/server-down.sh scripts/sync-cert.sh dist/deploy-bundle/porta/scripts/
          cp deploy/99-porta-quic.conf deploy/porta-cert-sync.timer dist/deploy-bundle/porta/deploy/
          tar -C dist/deploy-bundle -czf dist/porta-deploy.tar.gz porta
      - name: Prepare Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PORTA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PORTA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PORTA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PORTA_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" || -n "$KEYSTORE_PASSWORD" || -n "$KEY_ALIAS" || -n "$KEY_PASSWORD" ]]; then
            test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/porta-release.jks"
            echo "PORTA_ANDROID_KEYSTORE=$RUNNER_TEMP/porta-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Set Android release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^([0-9]{1,4})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if ((minor > 999 || patch > 999)); then
            echo "release minor and patch versions must not exceed 999" >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if ((version_code < 1 || version_code > 2100000000)); then
            echo "release version is outside Android's version-code range" >&2
            exit 1
          fi
          echo "PORTA_ANDROID_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "PORTA_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: Build Android release
        working-directory: android
        env:
          PORTA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PORTA_ANDROID_KEYSTORE_PASSWORD }}
          PORTA_ANDROID_KEY_ALIAS: ${{ secrets.PORTA_ANDROID_KEY_ALIAS }}
          PORTA_ANDROID_KEY_PASSWORD: ${{ secrets.PORTA_ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - name: Collect artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/porta-android-arm64-v8a.apk
          cp android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/porta-android-armeabi-v7a.apk
          cp android/app/build/outputs/apk/release/app-x86_64-release.apk dist/porta-android-x86_64.apk
          cd dist
          sha256sum porta-server-* porta-client-* porta-keygen-* porta-android-* porta-deploy.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag ||
              gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/porta-server-* \
            dist/porta-client-* \
            dist/porta-keygen-* \
            dist/porta-android-* \
            dist/porta-deploy.tar.gz \
            dist/SHA256SUMS
