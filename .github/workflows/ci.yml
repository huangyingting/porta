name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify application version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          BEFORE_REVISION: ${{ github.event.before }}
        run: |
          previous_revision=
          if [[ "$EVENT_NAME" == pull_request ]]; then
            previous_revision=$BASE_REVISION
          elif [[ "$EVENT_NAME" == push && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            previous_revision=$BEFORE_REVISION
          fi
          ./scripts/check-version.sh "$previous_revision"
      - run: make test-automation
      - run: make test
      - run: make test-race
      - name: Test native MTU feedback in an isolated network namespace
        run: |
          if ! command -v nft >/dev/null || ! command -v ip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y nftables iproute2
          fi
          make test-native-mtu
      - run: make vet
      - run: make build
      - run: make build-windows

  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows packages
        env:
          PORTA_WFP_NATIVE_TEST: "1"
        run: go test -count=1 ./internal/clientapp ./internal/clientprofile ./internal/winnetwork ./cmd/porta-client ./cmd/porta-windows
      - name: Build Windows applications
        shell: pwsh
        run: |
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o porta.exe ./cmd/porta-windows
          go build -trimpath -ldflags="-s -w" -o porta-cli.exe ./cmd/porta-client
      - name: Smoke test desktop startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\porta.exe -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw "Porta desktop client exited during startup" }
          Stop-Process -Id $process.Id

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release signing cannot fall back to a debug key
        working-directory: android
        env:
          PORTA_ANDROID_SIGNING_PROPERTIES: ${{ runner.temp }}/missing-porta-signing.properties
        run: |
          if ./gradlew :app:assembleRelease --no-daemon > "$RUNNER_TEMP/porta-signing-check.log" 2>&1; then
            echo "Release signing unexpectedly succeeded without the persistent key" >&2
            exit 1
          fi
          grep -q "Release signing is not configured" "$RUNNER_TEMP/porta-signing-check.log"
      - working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
