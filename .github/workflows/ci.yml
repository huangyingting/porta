name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      live_clients:
        description: Run credential-free Windows and Android probes against the development server
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    if: ${{ github.event_name != 'schedule' && !inputs.live_clients }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          cache-bin: "false"
          cache-targets: "true"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
      - name: Verify application version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
          BEFORE_REVISION: ${{ github.event.before }}
        run: |
          previous_revision=
          if [[ "$EVENT_NAME" == pull_request ]]; then
            previous_revision=$BASE_REVISION
          elif [[ "$EVENT_NAME" == push && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            previous_revision=$BEFORE_REVISION
          fi
          ./scripts/check-version.sh "$previous_revision"
      - name: Install native integration dependencies
        run: |
          if ! command -v nft >/dev/null || ! command -v ip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y nftables iproute2
          fi
      - run: make test
      - name: Test native firewall and client networking
        run: make test-native-firewall
      - run: make build
      - run: make test-rust-interop

  windows:
    if: ${{ github.event_name != 'schedule' && !inputs.live_clients }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: windows
          cache-bin: "false"
          cache-targets: "true"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
      - name: Lint Windows clients
        run: >
          cargo clippy --manifest-path rust/Cargo.toml --locked
          --target x86_64-pc-windows-msvc --all-targets
          --package porta-client-rust
          --package porta-keygen
          --package porta-windows
          --package porta-windows-package
          -- -D warnings
      - name: Test Windows clients and native WFP transactions
        env:
          PORTA_WFP_NATIVE_TEST: "1"
          PORTA_WFP_NATIVE_TEST_MARKER: ${{ runner.temp }}\porta-wfp-native.ok
        shell: pwsh
        run: |
          Remove-Item -LiteralPath $env:PORTA_WFP_NATIVE_TEST_MARKER -Force -ErrorAction SilentlyContinue
          cargo test --manifest-path rust/Cargo.toml --locked `
            --target x86_64-pc-windows-msvc --all-targets `
            --package porta-client-rust `
            --package porta-keygen `
            --package porta-windows `
            --package porta-windows-package
          if (-not (Test-Path -LiteralPath $env:PORTA_WFP_NATIVE_TEST_MARKER)) {
            throw "native WFP rollback acceptance did not run"
          }
      - name: Build Windows applications
        run: >
          cargo build --manifest-path rust/Cargo.toml --locked --release
          --target x86_64-pc-windows-msvc
          --package porta-client-rust
          --package porta-windows
      - name: Smoke test desktop startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\rust\target\x86_64-pc-windows-msvc\release\porta.exe -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) { throw "Porta desktop client exited during startup" }
          Stop-Process -Id $process.Id
      - name: Package Windows applications
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item rust\target\x86_64-pc-windows-msvc\release\porta.exe package\porta.exe
          Copy-Item rust\target\x86_64-pc-windows-msvc\release\porta-client.exe package\porta-cli.exe
          Invoke-WebRequest -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $expected = "07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51"
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash -ne $expected) {
            throw "Wintun archive checksum mismatch"
          }
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll package\wintun.dll
          cargo run --manifest-path rust/Cargo.toml --locked --release `
            --package porta-windows-package -- porta-client-windows-amd64.zip package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: porta-client-windows-amd64
          path: porta-client-windows-amd64.zip
          if-no-files-found: error

  android:
    if: ${{ github.event_name != 'schedule' && !inputs.live_clients }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: android
          cache-bin: "false"
          cache-targets: "true"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify release signing cannot fall back to a debug key
        working-directory: android
        env:
          PORTA_ANDROID_SIGNING_PROPERTIES: ${{ runner.temp }}/missing-porta-signing.properties
        run: |
          if ./gradlew :app:validatePortaReleaseSigning --no-daemon > "$RUNNER_TEMP/porta-signing-check.log" 2>&1; then
            echo "Release signing unexpectedly succeeded without the persistent key" >&2
            exit 1
          fi
          grep -q "Release signing is not configured" "$RUNNER_TEMP/porta-signing-check.log"
      - working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk

  live-windows:
    if: ${{ github.event_name == 'schedule' || inputs.live_clients || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PORTA_TLS_TEST_URL: https://porta-dev.i-csu.org:8443
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore Windows Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: windows
          cache-bin: "false"
          cache-targets: "true"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
      - name: Probe the live gateway with native Windows transports
        run: >
          cargo test --manifest-path rust/Cargo.toml --locked
          --package porta-client-rust --test platform_tls
          -- --ignored --nocapture

  live-android:
    if: ${{ github.event_name == 'schedule' || inputs.live_clients || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Restore Android Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust -> target
          shared-key: android
          cache-bin: "false"
          cache-targets: "true"
          cache-all-crates: "false"
          cache-workspace-crates: "false"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probe the live gateway from an Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          ndk: 27.2.12479018
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-spellchecker: true
          working-directory: android
          script: >-
            ./gradlew connectedDebugAndroidTest --no-daemon --max-workers=2
            -Pandroid.testInstrumentationRunnerArguments.class=dev.porta.android.CertificateVerificationTest
            -Pandroid.testInstrumentationRunnerArguments.portaTlsOrigin=https://porta-dev.i-csu.org:8443
