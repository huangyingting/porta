[package]
name = "porta-linux"
version = "0.1.43"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "porta-desktop"
path = "src/main.rs"

[features]
# The window and tray need GTK and WebKitGTK development files, so
# workspace builds leave them out; release builds enable this feature.
gui = ["dep:libc", "dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.6.3", optional = true }

[dependencies]
serde_json = "1.0.145"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2.178", optional = true }
tauri = { version = "2.11.5", optional = true, default-features = false, features = [
  "compression",
  "image-png",
  "tray-icon",
  "wry",
] }

[dev-dependencies]
tempfile = "3.23.0"
