[package]
name = "porta-server-rust"
version = "0.1.36"
edition = "2021"
publish = false

[[bin]]
name = "porta-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
arc-swap = "1.7.1"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.53", features = ["derive"] }
futures-util = "0.3.31"
h2 = "0.4.12"
h3 = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2" }
h3-datagram = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2" }
h3-quinn = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2", features = ["datagram"] }
hex = "0.4.3"
hmac = "0.12.1"
http = "1.3.1"
http-body-util = "0.1.3"
humantime = "2.3.0"
hyper = { version = "1.8.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.19", features = ["server-auto", "tokio"] }
ipnet = { version = "2.11.0", features = ["serde"] }
libc = "0.2.178"
parking_lot = "0.12.5"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
pem = "3.0.6"
porta-wire = { path = "../porta-wire" }
quinn = { version = "0.11.9", default-features = false, features = ["bloom", "runtime-tokio", "rustls-aws-lc-rs"] }
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rustls = "0.23.35"
rustls-acme = { version = "0.15.4", default-features = false, features = ["aws-lc-rs", "tls12", "webpki-roots"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
socket2 = "0.6.1"
subtle = "2.6.1"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.17", features = ["io", "rt"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
zeroize = { version = "1.8.2", features = ["derive"] }
httpdate = "1.0.3"

[dev-dependencies]
rcgen = { version = "0.14.5", features = ["aws_lc_rs"] }
tempfile = "3.23.0"
