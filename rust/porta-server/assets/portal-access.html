<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="/assets/porta-mark.svg" type="image/svg+xml">
  <title>Get access · Porta</title>
  <style>
    @font-face{font-family:"Mona Sans";src:url("/assets/mona-sans.woff2") format("woff2-variations");font-weight:200 900;font-display:swap}
    :root{font-family:"Mona Sans",sans-serif;color:#171923;background:#f5f6fa}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 15%,rgba(115,217,208,.3),transparent 24rem),radial-gradient(circle at 10% 90%,rgba(102,92,246,.16),transparent 28rem),#f5f6fa}
    .card{width:min(430px,100%);padding:30px;border:1px solid rgba(255,255,255,.9);border-radius:22px;background:rgba(255,255,255,.86);box-shadow:0 28px 80px rgba(35,40,68,.12)}
    .brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-size:15px;font-weight:800}
    .brand img{width:32px}
    h1{margin:44px 0 10px;font-size:38px;letter-spacing:-.05em}
    p{color:#747987;font-size:14px;line-height:1.6}
    .field{display:grid;gap:7px;margin-top:24px}
    .field label{font-size:11px;font-weight:750;letter-spacing:.09em;text-transform:uppercase}
    .field input{width:100%;border:1px solid #dfe1e8;border-radius:11px;background:white;padding:13px 14px;outline:none;font:inherit;font-size:14px}
    .field input:focus{border-color:#8f86ef;box-shadow:0 0 0 3px rgba(102,92,246,.1)}
    button{width:100%;margin-top:12px;border:0;border-radius:11px;background:#171923;color:white;padding:13px;font:inherit;font-size:13px;font-weight:750;cursor:pointer}
    .note{margin:14px 0 0;font-size:11px}
    .error{margin:14px 0 0;color:#b44858;font-weight:650}
    @media(max-width:430px){body{place-items:start center;padding:14px}.card{margin-top:8vh;padding:23px;border-radius:18px}h1{margin-top:32px;font-size:34px}.field{margin-top:20px}}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/"><img src="/assets/porta-mark.svg" alt="">Porta</a>
    <h1>Get access.</h1>
    <p>Enter the token provided for your account.</p>
    <form method="post" action="/access">
      <div class="field">
        <label for="token">Access token</label>
        <input id="token" name="token" type="password" autocomplete="current-password" autofocus required>
      </div>
      <button type="submit">Continue</button>
    </form>
    %%PORTA_ACCESS_MESSAGE%%
    <p class="note">Credentials are exchanged for a secure, temporary browser session.</p>
  </main>
</body>
</html>
