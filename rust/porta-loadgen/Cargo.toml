[package]
name = "porta-loadgen"
version = "0.1.37"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0.100"
humantime = "2.3.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }
porta-client-rust = { path = "../porta-client" }
porta-wire = { path = "../porta-wire" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
