[package]
name = "porta-wire"
version = "0.1.36"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22.1"
http = "1.3.1"
hex = "0.4.3"
ipnet = { version = "2.11.0", features = ["serde"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing", "serde"] }
