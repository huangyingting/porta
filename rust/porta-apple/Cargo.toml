[package]
name = "porta-apple"
version = "0.1.40"
edition = "2021"
publish = false

[lib]
# libporta.a for the macOS and iOS apps' packet tunnel extension; the C
# interface also builds and is tested on Linux.
name = "porta"
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22.1"
porta-client-rust = { path = "../porta-client" }
porta-wire = { path = "../porta-wire" }
rand = "0.9.2"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
url = "2.5.7"

[dev-dependencies]
p256 = { version = "0.14.0", features = ["ecdsa", "getrandom", "pkcs8"] }
time = "0.3.44"
