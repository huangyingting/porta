[package]
name = "porta-client-rust"
version = "0.1.36"
edition = "2021"
publish = false

[lib]
name = "porta_client"
path = "src/lib.rs"

[[bin]]
name = "porta-client"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.5.53", features = ["derive"] }
futures-util = "0.3.31"
h2 = "0.4.12"
h3 = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2" }
h3-datagram = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2" }
h3-quinn = { git = "https://github.com/hyperium/h3.git", rev = "1f3d5295833ad454343f25d55633fb6bee1027b2", features = ["datagram"] }
hex = "0.4.3"
http = "1.3.1"
humantime = "2.3.0"
ipnet = "2.11.0"
libc = "0.2.178"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
porta-wire = { path = "../porta-wire" }
quinn = { version = "0.11.9", default-features = false, features = ["bloom", "runtime-tokio", "rustls-aws-lc-rs"] }
rand = "0.9.2"
rustls = "0.23.35"
rustls-platform-verifier = "0.7.0"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.17", features = ["rt"] }
url = "2.5.7"
zeroize = "1.8.2"

[dev-dependencies]
rcgen = { version = "0.14.5", features = ["aws_lc_rs"] }
tempfile = "3.23.0"

[target.'cfg(windows)'.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
fs2 = "0.4.3"
wintun = "0.5.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Rpc",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
