[package]
name = "porta-keygen"
version = "0.1.44"
edition = "2021"
publish = false

[dependencies]
porta-wire = { path = "../porta-wire" }
clap = { version = "4.5.53", features = ["derive"] }
rand = "0.10.4"
rcgen = { version = "0.14.5", default-features = false, features = ["aws_lc_rs", "pem"] }
thiserror = "2.0.17"
time = "0.3.44"

[dev-dependencies]
tempfile = "3.23.0"
x509-parser = { version = "0.18.0", features = ["verify-aws"] }
